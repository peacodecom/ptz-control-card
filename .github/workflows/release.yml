name: Release
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - run: npm audit --audit-level=low
      - name: Generate checksum
        working-directory: dist
        run: sha256sum ptz-control-card.js > SHA256SUMS.txt
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/ptz-control-card.js dist/LICENSE dist/SHA256SUMS.txt --clobber
